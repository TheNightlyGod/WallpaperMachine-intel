# Everything a macOS job needs before scripts/build.py can run: Xcode 26 with its Metal
# Toolchain, the Homebrew packages, and the two caches that keep a release from compiling
# the world. Shared by
# Build's build job, the Test workflow's jobs and Warm caches, so all of them read and
# write the same cache entries.
#
# Caches (docs/release.md, "Build (build.yml)"), all scoped to main, which every ref can read.
# Only runs on main save them: a cache saved under a pull request, branch or tag can be
# read by no other ref, and those entries pushed the repository past GitHub's 10 GB
# limit, evicting the main entries releases restore. Other refs restore and never save.
# - ccache: the C++ scene engine's objects, hashed by content, so the fresh mtimes of a
#   checkout (which force CMake to recompile everything) cost cache lookups, not builds.
#   Saved under a new key every run and restored by prefix. Test's parallel jobs
#   share a run's key, so only the one that compiles the most (`renderer`) saves it;
#   the others pass `save-object-cache: "false"`.
# - renderer: cargo's registry and target directory, keyed on the toolchain file, then
#   the lock file and the vendored revision. It is restored only from entries built by
#   the same toolchain, whose target directories are the only ones cargo can reuse.
name: Prepare build
description: Select Xcode 26 and its Metal Toolchain, install the build dependencies and restore the build caches.

inputs:
  save-object-cache:
    description: "Save the C++ object cache when the job ends (runs on main only)."
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Select Xcode 26
      shell: bash
      run: |
        set -euo pipefail
        xcode="$(ls -d /Applications/Xcode_26*.app | grep -iv beta | sort -V | tail -n 1)"
        sudo xcode-select -s "${xcode}"

    - name: Install the Metal Toolchain
      # Xcode 26 downloads the Metal compiler separately, and the runner images do not always
      # have it for the Xcode selected above (actions/runner-images#13014). The extension
      # compiles a Core Image kernel (Shared/WallpaperEngineColor.ci.metal), so without it
      # the app build stops at CompileMetalFile. The download is skipped when it is there.
      shell: bash
      run: |
        set -euo pipefail
        if ! xcrun metal --version > /dev/null 2>&1; then
          xcodebuild -downloadComponent MetalToolchain
        fi
        xcrun metal --version

    - name: Install renderer and Xcode project dependencies
      id: brew
      shell: bash
      run: |
        set -euo pipefail
        brew install --quiet xcodegen cmake quickjs-ng libpng brotli lz4 \
          nlohmann-json argparse ccache
        # Bottles and compiled objects differ per macOS release, so every
        # cache key carries the runner's (macos-15, macos-26).
        echo "os=macos-$(sw_vers -productVersion | cut -d. -f1)" >> "$GITHUB_OUTPUT"

    - name: Decide which caches to save
      id: save
      shell: bash
      env:
        SAVE_OBJECT_CACHE: ${{ inputs.save-object-cache }}
        REF: ${{ github.ref }}
      run: |
        set -euo pipefail
        main=false
        if [ "${REF}" = "refs/heads/main" ]; then main=true; fi
        objects=false
        if [ "${main}" = true ] && [ "${SAVE_OBJECT_CACHE}" = true ]; then objects=true; fi
        {
          echo "renderer=${main}"
          echo "objects=${objects}"
        } >> "$GITHUB_OUTPUT"

    - name: Route the C++ compilers through ccache
      shell: bash
      # CMake reads these on the first configure of a build tree; the renderer cache
      # prefix changed with their introduction so no tree configured without them is
      # restored. `%compiler% -v` keys objects on the real clang behind the
      # /usr/bin shims, which an Xcode update changes without touching the shims.
      run: |
        set -euo pipefail
        {
          echo "CCACHE_DIR=${HOME}/.ccache"
          echo "CCACHE_BASEDIR=${GITHUB_WORKSPACE}"
          echo "CCACHE_COMPILERCHECK=%compiler% -v"
          echo "CCACHE_MAXSIZE=2G"
          for language in C CXX OBJC OBJCXX; do
            echo "CMAKE_${language}_COMPILER_LAUNCHER=ccache"
          done
        } >> "$GITHUB_ENV"

    - name: Restore the C++ object cache
      if: steps.save.outputs.objects == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ccache-${{ steps.brew.outputs.os }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: ccache-${{ steps.brew.outputs.os }}-

    - name: Restore the C++ object cache without saving it
      if: steps.save.outputs.objects != 'true'
      uses: actions/cache/restore@v4
      with:
        path: ~/.ccache
        key: ccache-${{ steps.brew.outputs.os }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: ccache-${{ steps.brew.outputs.os }}-

    - name: Reset the C++ object cache statistics
      shell: bash
      run: ccache --zero-stats

    - name: Restore the renderer build
      if: steps.save.outputs.renderer == 'true'
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          Renderer/target
        key: renderer-ccache-${{ steps.brew.outputs.os }}-${{ hashFiles('Renderer/rust-toolchain.toml') }}-${{ hashFiles('Renderer/Cargo.lock', 'ThirdParty/provenance.json') }}
        restore-keys: renderer-ccache-${{ steps.brew.outputs.os }}-${{ hashFiles('Renderer/rust-toolchain.toml') }}-

    - name: Restore the renderer build without saving it
      if: steps.save.outputs.renderer != 'true'
      uses: actions/cache/restore@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          Renderer/target
        key: renderer-ccache-${{ steps.brew.outputs.os }}-${{ hashFiles('Renderer/rust-toolchain.toml') }}-${{ hashFiles('Renderer/Cargo.lock', 'ThirdParty/provenance.json') }}
        restore-keys: renderer-ccache-${{ steps.brew.outputs.os }}-${{ hashFiles('Renderer/rust-toolchain.toml') }}-
