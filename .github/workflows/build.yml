# Build the Release app on macOS, prove what was built, and attach its disk image to the
# tag's GitHub Release.
#
# Called by Version right after it pushes a bump tag, and by Release for hand-pushed
# tags. Version has to call it directly: a tag pushed with GITHUB_TOKEN never starts
# another workflow, so Release alone would never run for CI-produced tags.
#
# Three jobs. `app-icon` compiles the Icon Composer icon on macOS 26, because Xcode 26's
# actool crashes on most attempts to compile an .icon on macOS 15. `build` makes the
# Release image on macOS 15 with that icon, and `publish` releases it. The test gate is
# not part of a release: every change passes `python3 scripts/test.py` before it is
# committed, and on hosted VMs the gate failed only on timing and layout the VM got
# wrong, unpublishing five 1.5 tags in a row; Test runs it by hand. The release is
# created as a draft and published only after the disk image it needs is uploaded, so
# the in-app updater never sees a "latest" release with nothing to download.
# Everything published is derived from the build or recorded at the tag: the notes
# from the tag's translated CHANGELOG.md section (generated once into that file when
# the tag has none), the checksum and the update manifest from the image and that
# CHANGELOG.md, the provenance attestation from this run.
name: Build

on:
  workflow_call:
    inputs:
      tag:
        description: "Version tag to build and publish."
        required: true
        type: string

permissions:
  contents: read

jobs:
  app-icon:
    # A few seconds of actool, but it has to be macOS 26: on macOS 15, Xcode 26's actool
    # (every 26.x on the runner image) exits 255 on most .icon compiles. The asset
    # catalog alone compiles there reliably, so `build` still compiles that itself.
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Compile the app icon
        run: |
          set -euo pipefail
          # shellcheck disable=SC2010 # Xcode bundle names carry no odd characters
          xcode="$(ls -d /Applications/Xcode_26*.app | grep -iv beta | sort -V | tail -n 1)"
          sudo xcode-select -s "${xcode}"
          python3 scripts/build.py --compile-app-icon "${RUNNER_TEMP}/app-icon"

      - uses: actions/upload-artifact@v4
        with:
          name: app-icon-${{ inputs.tag }}
          path: ${{ runner.temp }}/app-icon/
          if-no-files-found: error
          retention-days: 7

  build:
    needs: app-icon
    # The oldest runner that carries Xcode 26. Homebrew pours bottles built for the
    # runner's own release, and the app bundles those dylibs, so the runner's macOS
    # is the lowest release the published app can launch on (docs/build.md).
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          # Release notes read the commits between this tag and the previous one.
          fetch-depth: 0

      - name: Write the release notes
        # Before the long build, so a notes problem fails in seconds. A translated
        # CHANGELOG.md section is reused. A hand-pushed tag without one asks the model
        # once and writes that exact section into the working tree, and the copy handed
        # to publish carries it into the update manifest, whose sections the app's
        # update window shows. GitHub uses only the English notes and compare link.
        # Source history missing required translations fails.
        env:
          TAG: ${{ inputs.tag }}
          RELEASE_NOTES_API_KEY: ${{ secrets.RELEASE_NOTES_API_KEY }}
          # Names the GitHub account behind each commit, for the thanks line.
          RELEASE_NOTES_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/release"
          python3 scripts/release_notes.py --tag "$TAG" --release-body --ai \
            --built-from "$(git rev-parse HEAD)" --output "${RUNNER_TEMP}/release/notes.md"
          cp CHANGELOG.md "${RUNNER_TEMP}/release/CHANGELOG.md"
          cat "${RUNNER_TEMP}/release/notes.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: ./.github/actions/prepare-build
        with:
          # Restore only: an upload here would hold up the release. Warm caches saves
          # them every day, and the renderer build is reused for every source this
          # release has not changed since.
          save-object-cache: "false"
          reuse-renderer-build: "true"

      - uses: actions/download-artifact@v4
        with:
          name: app-icon-${{ inputs.tag }}
          path: ${{ runner.temp }}/app-icon

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild -version
          python3 scripts/build.py --configuration Release --app-icon "${RUNNER_TEMP}/app-icon"

      - name: Import the Developer ID certificate and the notary credentials
        # Releases are signed with the project's Developer ID and notarized, so a downloaded
        # copy opens without Open Anyway, and their designated requirement (identifier,
        # Apple's Developer ID chain, team) is the same from one release to the next, so
        # macOS keeps the app's privacy permissions after an in-app update
        # (docs/build.md#release-signing). A missing secret fails here instead of shipping
        # a build Gatekeeper holds or that drops those permissions.
        env:
          DEVELOPER_ID_CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER: ${{ secrets.NOTARY_API_ISSUER }}
        run: |
          set -euo pipefail
          missing=""
          for name in DEVELOPER_ID_CERTIFICATE_P12 DEVELOPER_ID_CERTIFICATE_PASSWORD NOTARY_API_KEY NOTARY_API_KEY_ID NOTARY_API_ISSUER; do
            if [ -z "${!name}" ]; then missing="${missing} ${name}"; fi
          done
          if [ -n "${missing}" ]; then
            echo "::error::Missing repository secrets:${missing} (docs/build.md#release-signing)."
            exit 1
          fi
          keychain="${RUNNER_TEMP}/signing.keychain-db"
          certificate="${RUNNER_TEMP}/signing.p12"
          key="${RUNNER_TEMP}/notary-key.p8"
          password="$(openssl rand -hex 24)"
          printf '%s' "${DEVELOPER_ID_CERTIFICATE_P12}" | base64 -d > "${certificate}"
          security create-keychain -p "${password}" "${keychain}"
          security set-keychain-settings -lut 21600 "${keychain}"
          security unlock-keychain -p "${password}" "${keychain}"
          security import "${certificate}" -k "${keychain}" -P "${DEVELOPER_ID_CERTIFICATE_PASSWORD}" -T /usr/bin/codesign
          rm -f "${certificate}"
          # Apple's Developer ID intermediates, so codesign can build the chain whichever
          # one issued the certificate; the runner image does not promise either. A .p12
          # exported from Keychain Access usually carries its issuer already, and
          # `security import` fails on a certificate the keychain holds: that one is skipped.
          for intermediate in DeveloperIDCA DeveloperIDG2CA; do
            curl -fsSL --retry 3 "https://www.apple.com/certificateauthority/${intermediate}.cer" -o "${RUNNER_TEMP}/${intermediate}.cer"
            if output="$(security import "${RUNNER_TEMP}/${intermediate}.cer" -k "${keychain}" 2>&1)"; then
              echo "${output}"
            else
              case "${output}" in
                *"already exists"*) echo "${intermediate}: already in the keychain" ;;
                *) echo "${output}" >&2; exit 1 ;;
              esac
            fi
          done
          # Lets codesign use the key without a keychain prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${password}" "${keychain}" > /dev/null
          # shellcheck disable=SC2046 # keychain paths carry no spaces on the runner
          security list-keychains -d user -s "${keychain}" $(security list-keychains -d user | tr -d '"')
          # The App Store Connect API key becomes a notarytool profile in the same temporary
          # keychain; storing it also checks it with Apple, so a wrong key fails here.
          printf '%s\n' "${NOTARY_API_KEY}" > "${key}"
          xcrun notarytool store-credentials "WallpaperMachine Notary" --key "${key}" \
            --key-id "${NOTARY_API_KEY_ID}" --issuer "${NOTARY_API_ISSUER}" --keychain "${keychain}"
          rm -f "${key}"

      - name: Package
        # Relocates the bundle and signs it with the Developer ID and the hardened runtime,
        # has Apple notarize the app and staples the ticket to it, wraps it in the
        # drag-to-install disk image, signs, notarizes and staples the image, mounts it to
        # check the app's identifier, version, signature, ticket and the Applications link,
        # and only then writes the .sha256 sidecar (docs/build.md).
        run: |
          python3 scripts/package.py --configuration Release --require-deployment-target \
            --sign-identity "Developer ID Application" \
            --notarize "WallpaperMachine Notary" --notary-keychain "${RUNNER_TEMP}/signing.keychain-db"

      - name: Match the disk image to the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          directory="build/Build/Products/Release"
          name="WallpaperMachine-${TAG#v}-arm64.dmg"
          if [ ! -f "${directory}/${name}" ]; then
            echo "::error::No ${name} in ${directory}. scripts/package.py names the image from the built bundle's CFBundleShortVersionString, so the version bump never reached this build."
            ls -1 "${directory}"/*.dmg 2>/dev/null || true
            exit 1
          fi
          cp "${directory}/${name}" "${directory}/${name}.sha256" "${RUNNER_TEMP}/release/"
          {
            echo "### \`${name}\`"
            echo ""
            echo '```'
            cat "${directory}/${name}.sha256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report the C++ object cache
        if: always()
        run: ccache --show-stats

      - name: Keep the build logs of a failed build
        # scripts/build.py prints only a filtered summary; the full tool output, which
        # names the command that failed and why, is under artifacts/build/.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ inputs.tag }}
          path: artifacts/build/
          if-no-files-found: ignore
          retention-days: 14

      - name: Hand the image to publish
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ inputs.tag }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          # A disk image is already compressed.
          compression-level: 0
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Builds remain per-tag and parallel; publication is repository-wide so the
    # post-upload Latest decision cannot race another version's promotion.
    # Queue waiting releases, rather than replacing the one pending job.
    concurrency:
      group: release-promotion-${{ github.repository }}
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write
      # actions/attest-build-provenance signs with a workflow OIDC token and records
      # the attestation against the repository.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          name: release-${{ inputs.tag }}
          path: ${{ runner.temp }}/release

      - name: Locate the image
        id: image
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          name="WallpaperMachine-${TAG#v}-arm64.dmg"
          {
            echo "image=${RUNNER_TEMP}/release/${name}"
            echo "checksum=${RUNNER_TEMP}/release/${name}.sha256"
          } >> "$GITHUB_OUTPUT"
          # The sidecar was written on the build runner; the image must still match it.
          (cd "${RUNNER_TEMP}/release" && sha256sum -c "${name}.sha256")

      - name: Attest the build provenance
        # The SLSA predicate records this workflow run and the revision that
        # triggered it. For a Version-produced tag that trigger is the push to main,
        # not the bump commit the tag points at, so the attestation identifies the
        # run and the builder, not the built source. The notes carry the built
        # revision instead, and it is checkable against the tag.
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.image.outputs.image }}

      - name: Write the update manifest
        id: manifest
        # The updater reads this asset through github.com's releases/latest/download
        # redirect, which the 60-an-hour anonymous API limit does not count; releases
        # without it are read from the API. Derived from the tag, the notes that become
        # the release body, the image bytes checked above and the newest CHANGELOG.md
        # sections the update window lists. The changelog is the build job's copy, which
        # holds a section generated for a hand-pushed tag; this job's checkout does not.
        env:
          TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ github.repository }}
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          manifest="$(python3 scripts/update_manifest.py --tag "$TAG" --repository "$REPOSITORY" \
            --notes "${RUNNER_TEMP}/release/notes.md" --changelog "${RUNNER_TEMP}/release/CHANGELOG.md" "$IMAGE")"
          echo "manifest=${manifest}" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          IMAGE: ${{ steps.image.outputs.image }}
          CHECKSUM: ${{ steps.image.outputs.checksum }}
          MANIFEST: ${{ steps.manifest.outputs.manifest }}
        # Drafts first, a live release is refused rather than clobbered, and Latest
        # is claimed only when no greater version is public: scripts/publish_release.py,
        # covered by scripts/tests/test_publish_release.py.
        run: |
          python3 scripts/publish_release.py --tag "$TAG" --notes "${RUNNER_TEMP}/release/notes.md" \
            "$IMAGE" "$CHECKSUM" "$MANIFEST"
