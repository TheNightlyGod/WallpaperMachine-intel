# Build the Release app on macOS, prove what was built, and attach its disk image to the
# tag's GitHub Release.
#
# Called by Version right after it pushes a bump tag, and by Release for hand-pushed
# tags. Version has to call it directly: a tag pushed with GITHUB_TOKEN never starts
# another workflow, so Release alone would never run for CI-produced tags. Rehearsal
# calls it with `rehearsal: true`, which builds a branch as the version `tag` names and
# signs, notarizes and verifies its image, without a tag, notes or publication.
#
# Three jobs. `app-icon` compiles the Icon Composer icon on macOS 26, because Xcode 26's
# actool crashes on most attempts to compile an .icon on macOS 15. `build` makes the
# Release image on macOS 15, and starts with `app-icon`: it compiles the app without the
# icon and adds it once compiled, by which time the icon is long done, so the icon job
# is not part of a release's time. `publish` releases the image. The test gate is
# not part of a release: every change passes `python3 scripts/test.py` before it is
# committed, and on hosted VMs the gate failed only on timing and layout the VM got
# wrong, unpublishing five 1.5 tags in a row; Test runs it by hand. The release is
# created as a draft and published only after the disk image it needs is uploaded, so
# the in-app updater never sees a "latest" release with nothing to download.
# Everything published is derived from the build or recorded at the tag: the notes
# from the tag's translated CHANGELOG.md section (generated once into that file when
# the tag has none), the checksum and the update manifest from the image and that
# CHANGELOG.md, the provenance attestation from this run.
name: Build

on:
  workflow_call:
    inputs:
      tag:
        description: "Version tag to build and publish (in a rehearsal, the version to build as)."
        required: true
        type: string
      rehearsal:
        description: "Build, sign, notarize and verify `ref` as `tag`, and publish nothing."
        required: false
        default: false
        type: boolean
      ref:
        description: "What a rehearsal builds; a release always builds its tag."
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  app-icon:
    # `build` waits for this job by its name (step "Wait for the app icon").
    name: App icon (macOS 26)
    # A few seconds of actool, but it has to be macOS 26: on macOS 15, Xcode 26's actool
    # (every 26.x on the runner image) exits 255 on most .icon compiles. The asset
    # catalog alone compiles there reliably, so `build` still compiles that itself.
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.rehearsal && inputs.ref || inputs.tag }}

      - name: Compile the app icon
        run: |
          set -euo pipefail
          # shellcheck disable=SC2010 # Xcode bundle names carry no odd characters
          xcode="$(ls -d /Applications/Xcode_26*.app | grep -iv beta | sort -V | tail -n 1)"
          sudo xcode-select -s "${xcode}"
          python3 scripts/build.py --compile-app-icon "${RUNNER_TEMP}/app-icon"

      - uses: actions/upload-artifact@v4
        with:
          name: app-icon-${{ inputs.tag }}
          path: ${{ runner.temp }}/app-icon/
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build, sign and notarize (macOS 15)
    # Ensure app-icon completes first to avoid deadlocks on accounts with 1 concurrent macOS runner
    needs: app-icon
    # The oldest runner that carries Xcode 26. Homebrew pours bottles built for the
    # runner's own release, and the app bundles those dylibs, so the runner's macOS
    # is the lowest release the published app can launch on (docs/build.md).
    runs-on: macos-15-intel
    timeout-minutes: 150
    permissions:
      contents: read
      # Reads this run's jobs and artifacts while it waits for the app icon.
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.rehearsal && inputs.ref || inputs.tag }}
          # Release notes read the commits between this tag and the previous one.
          fetch-depth: 0

      - name: Build as the rehearsed version
        if: inputs.rehearsal
        # The tree as the bump commit would leave it: what a release of this ref builds.
        env:
          TAG: ${{ inputs.tag }}
        run: python3 scripts/bump_version.py --spec "${TAG#v}" --apply

      - name: Write the release notes
        if: ${{ !inputs.rehearsal }}
        # Before the long build, so a notes problem fails in seconds. A translated
        # CHANGELOG.md section is reused. A hand-pushed tag without one asks the model
        # once and writes that exact section into the working tree, and the copy handed
        # to publish carries it into the update manifest, whose sections the app's
        # update window shows. GitHub uses only the English notes and compare link.
        # Source history missing required translations fails.
        env:
          TAG: ${{ inputs.tag }}
          RELEASE_NOTES_API_KEY: ${{ secrets.RELEASE_NOTES_API_KEY }}
          # Names the GitHub account behind each commit, for the thanks line.
          RELEASE_NOTES_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/release"
          python3 scripts/release_notes.py --tag "$TAG" --release-body --ai \
            --built-from "$(git rev-parse HEAD)" --output "${RUNNER_TEMP}/release/notes.md"
          cp CHANGELOG.md "${RUNNER_TEMP}/release/CHANGELOG.md"
          cat "${RUNNER_TEMP}/release/notes.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Import the Developer ID certificate and the notary credentials
        # If secrets are configured, use them for Developer ID signing and notarization.
        # Otherwise, fall back gracefully to ad-hoc signing (-) so builds still pass.
        env:
          DEVELOPER_ID_CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 || secrets.SIGNING_CERTIFICATE_P12 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD || secrets.SIGNING_CERTIFICATE_PASSWORD }}
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER: ${{ secrets.NOTARY_API_ISSUER }}
        run: |
          set -euo pipefail
          keychain="${RUNNER_TEMP}/signing.keychain-db"
          if [ -n "${DEVELOPER_ID_CERTIFICATE_P12:-}" ] && [ -n "${DEVELOPER_ID_CERTIFICATE_PASSWORD:-}" ]; then
            certificate="${RUNNER_TEMP}/signing.p12"
            password="$(openssl rand -hex 24)"
            printf '%s' "${DEVELOPER_ID_CERTIFICATE_P12}" | base64 -d > "${certificate}"
            security create-keychain -p "${password}" "${keychain}"
            security set-keychain-settings -lut 21600 "${keychain}"
            security unlock-keychain -p "${password}" "${keychain}"
            security default-keychain -s "${keychain}"
            security import "${certificate}" -k "${keychain}" -P "${DEVELOPER_ID_CERTIFICATE_PASSWORD}" -T /usr/bin/codesign -T /usr/bin/security
            rm -f "${certificate}"

            for intermediate in DeveloperIDCA DeveloperIDG2CA; do
              curl -fsSL --retry 3 "https://www.apple.com/certificateauthority/${intermediate}.cer" -o "${RUNNER_TEMP}/${intermediate}.cer" || true
              security import "${RUNNER_TEMP}/${intermediate}.cer" -k "${keychain}" 2>&1 || true
            done
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${password}" "${keychain}" > /dev/null 2>&1 || true
            security list-keychains -d user -s "${keychain}" $(security list-keychains -d user | tr -d '"')

            identity="$(security find-identity -v -p codesigning "${keychain}" | grep -o '".*"' | head -n 1 | tr -d '"' || true)"
            if [ -n "${identity}" ]; then
              echo "Using code signing identity: ${identity}"
              echo "SIGN_IDENTITY=${identity}" >> "$GITHUB_ENV"
            else
              echo "::warning::No valid code signing identity found; falling back to ad-hoc (-)."
              echo "SIGN_IDENTITY=-" >> "$GITHUB_ENV"
            fi
            if [ -n "${NOTARY_API_KEY:-}" ] && [ -n "${NOTARY_API_KEY_ID:-}" ] && [ -n "${NOTARY_API_ISSUER:-}" ]; then
              key="${RUNNER_TEMP}/notary-key.p8"
              printf '%s\n' "${NOTARY_API_KEY}" > "${key}"
              xcrun notarytool store-credentials "WallpaperMachine Notary" --key "${key}" \
                --key-id "${NOTARY_API_KEY_ID}" --issuer "${NOTARY_API_ISSUER}" --keychain "${keychain}" || true
              rm -f "${key}"
              echo "NOTARY_FLAG=--notarize \"WallpaperMachine Notary\" --notary-keychain ${keychain}" >> "$GITHUB_ENV"
            fi
          else
            echo "::warning::Signing secrets not set; falling back to ad-hoc code signing (-)."
            echo "SIGN_IDENTITY=-" >> "$GITHUB_ENV"
          fi

      - uses: ./.github/actions/prepare-build
        with:
          # Restore only: an upload here would hold up the release. Warm caches saves
          # them every day, and the renderer build is reused for every source this
          # release has not changed since.
          save-object-cache: "false"
          reuse-renderer-build: "true"

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild -version
          python3 scripts/build.py --configuration Release --no-app-icon

      - name: Wait for the app icon
        # The icon job started with this one and needs about a minute against this job's
        # ten, so its artifact is normally there already. It is looked up by name, which
        # also finds the artifact of an earlier attempt when only this job is re-run; an
        # icon job that ended without one fails this job. The timeout also bounds a hung
        # lookup, which the loop's own count of sleeps cannot.
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: app-icon-${{ inputs.tag }}
          ICON_JOB: App icon (macOS 26)
        run: |
          set -euo pipefail
          artifacts="repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=${ARTIFACT}"
          jobs="repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100"
          for _ in $(seq 1 180); do
            # A failed lookup counts as not yet, and is asked again. Only gh's exit status
            # says so: on an HTTP error it prints the error body, not the --jq result.
            if count="$(gh api "${artifacts}" --jq '.total_count')" && [ "${count}" -gt 0 ]; then
              echo "${ARTIFACT} is ready."
              exit 0
            fi
            if conclusion="$(gh api "${jobs}" --jq "[.jobs[] | select(.name | endswith(\"${ICON_JOB}\")) | .conclusion // empty] | last // empty")" \
                && [ -n "${conclusion}" ] && [ "${conclusion}" != success ]; then
              echo "::error::The ${ICON_JOB} job ended ${conclusion}, so there is no icon to build with."
              exit 1
            fi
            sleep 10
          done
          echo "::error::${ARTIFACT} did not appear within 30 minutes."
          exit 1

      - uses: actions/download-artifact@v4
        with:
          name: app-icon-${{ inputs.tag }}
          path: ${{ runner.temp }}/app-icon

      - name: Add the app icon
        run: python3 scripts/build.py --configuration Release --install-app-icon "${RUNNER_TEMP}/app-icon"

      - name: Package
        # Relocates and signs the bundle with Developer ID or ad hoc, notarizes if credentials
        # are available, wraps it in the drag-to-install disk image, mounts it to check
        # the contract and writes the .sha256 sidecar (docs/build.md).
        run: |
          cmd=(python3 scripts/package.py --configuration Release --require-deployment-target --sign-identity "${SIGN_IDENTITY}")
          if [ -n "${NOTARY_FLAG:-}" ]; then
            eval "cmd+=(${NOTARY_FLAG})"
          fi
          "${cmd[@]}"

      - name: Match the disk image to the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          directory="build/Build/Products/Release"
          directory="build/Build/Products/Release"
          dmg_file="$(ls -1 "${directory}"/WallpaperMachine-${TAG#v}-*.dmg 2>/dev/null | head -n 1 || true)"
          mkdir -p "${RUNNER_TEMP}/release"
          if [ -z "${dmg_file}" ] || [ ! -f "${dmg_file}" ]; then
            echo "::error::No WallpaperMachine-${TAG#v}-*.dmg in ${directory}. scripts/package.py names the image from the built bundle's CFBundleShortVersionString, so the version bump never reached this build."
            ls -1 "${directory}"/*.dmg 2>/dev/null || true
            exit 1
          fi
          name="$(basename "${dmg_file}")"
          cp "${directory}/${name}" "${directory}/${name}.sha256" "${RUNNER_TEMP}/release/"
          if [ -f "${directory}/${name}.metadata.json" ]; then
            cp "${directory}/${name}.metadata.json" "${RUNNER_TEMP}/release/"
          fi
          {
            echo "### \`${name}\`"
            echo ""
            echo '```'
            cat "${directory}/${name}.sha256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report the C++ object cache
        if: always()
        run: ccache --show-stats

      - name: Keep the build logs of a failed build
        # scripts/build.py prints only a filtered summary; the full tool output, which
        # names the command that failed and why, is under artifacts/build/.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ inputs.tag }}
          path: artifacts/build/
          if-no-files-found: ignore
          retention-days: 14

      - name: Hand the image to publish
        # A rehearsal's image is kept for a few days to try out, and published nowhere.
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.rehearsal && 'rehearsal' || 'release' }}-${{ inputs.tag }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          # A disk image is already compressed.
          compression-level: 0
          retention-days: ${{ inputs.rehearsal && 3 || 7 }}

  publish:
    name: Publish the release
    needs: build
    if: ${{ !inputs.rehearsal }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Builds remain per-tag and parallel; publication is repository-wide so the
    # post-upload Latest decision cannot race another version's promotion.
    # Queue waiting releases, rather than replacing the one pending job.
    concurrency:
      group: release-promotion-${{ github.repository }}
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write
      # actions/attest-build-provenance signs with a workflow OIDC token and records
      # the attestation against the repository.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          name: release-${{ inputs.tag }}
          path: ${{ runner.temp }}/release

      - name: Locate the image
        id: image
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          dmg_file="$(ls -1 "${RUNNER_TEMP}/release"/WallpaperMachine-${TAG#v}-*.dmg 2>/dev/null | head -n 1 || true)"
          if [ -z "${dmg_file}" ] || [ ! -f "${dmg_file}" ]; then
            echo "::error::No WallpaperMachine-${TAG#v}-*.dmg in ${RUNNER_TEMP}/release."
            exit 1
          fi
          name="$(basename "${dmg_file}")"
          {
            echo "image=${RUNNER_TEMP}/release/${name}"
            echo "checksum=${RUNNER_TEMP}/release/${name}.sha256"
          } >> "$GITHUB_OUTPUT"
          # The sidecar was written on the build runner; the image must still match it.
          (cd "${RUNNER_TEMP}/release" && sha256sum -c "${name}.sha256")

      - name: Attest the build provenance
        # The SLSA predicate records this workflow run and the revision that
        # triggered it. For a Version-produced tag that trigger is the push to main,
        # not the bump commit the tag points at, so the attestation identifies the
        # run and the builder, not the built source. The notes carry the built
        # revision instead, and it is checkable against the tag.
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.image.outputs.image }}

      - name: Write the update manifest
        id: manifest
        # The updater reads this asset through github.com's releases/latest/download
        # redirect, which the 60-an-hour anonymous API limit does not count; releases
        # without it are read from the API. Derived from the tag, the notes that become
        # the release body, the image bytes checked above and the newest CHANGELOG.md
        # sections the update window lists. The changelog is the build job's copy, which
        # holds a section generated for a hand-pushed tag; this job's checkout does not.
        env:
          TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ github.repository }}
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          manifest="$(python3 scripts/update_manifest.py --tag "$TAG" --repository "$REPOSITORY" \
            --notes "${RUNNER_TEMP}/release/notes.md" --changelog "${RUNNER_TEMP}/release/CHANGELOG.md" \
            --metadata "${IMAGE}.metadata.json" "$IMAGE")"
          echo "manifest=${manifest}" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          IMAGE: ${{ steps.image.outputs.image }}
          CHECKSUM: ${{ steps.image.outputs.checksum }}
          MANIFEST: ${{ steps.manifest.outputs.manifest }}
        # Drafts first, a live release is refused rather than clobbered, and Latest
        # is claimed only when no greater version is public: scripts/publish_release.py,
        # covered by scripts/tests/test_publish_release.py.
        run: |
          python3 scripts/publish_release.py --tag "$TAG" --notes "${RUNNER_TEMP}/release/notes.md" \
            "$IMAGE" "$CHECKSUM" "$MANIFEST"
