# Keep the release build's caches current between releases.
#
# The release build only restores its caches, so they come from here: this builds the
# renderer through the same setup Build uses and saves a new renderer build and C++
# object cache for each macOS. A release then rebuilds only the renderer sources that
# changed since the last of these runs (scripts/source_times.py). GitHub also evicts an
# entry nobody has read for seven days. Scheduled runs use main, whose caches every ref,
# including release tags, can read. It publishes nothing.
name: Warm caches

on:
  schedule:
    # Daily, so a release's renderer build is at most a day behind main.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warm-caches
  cancel-in-progress: true

jobs:
  warm:
    # Build's release job runs on macOS 15, and the Test workflow and CodeQL's Swift job
    # on macOS 26; each macOS keeps its own entries.
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/prepare-build
        with:
          save-renderer-cache: "true"
          reuse-renderer-build: "true"

      - name: Build the renderer and bridge
        run: python3 scripts/build.py --renderer-only

      - name: Report the C++ object cache
        if: always()
        run: ccache --show-stats
