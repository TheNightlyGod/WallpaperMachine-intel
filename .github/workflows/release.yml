# Build and publish a GitHub Release for a hand-pushed version tag.
# Tags created by the Version workflow are published by that workflow instead,
# because a tag pushed with GITHUB_TOKEN does not start this one.
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  publish:
    name: Release ${{ github.ref_name }}
    uses: ./.github/workflows/build.yml
    with:
      tag: ${{ github.ref_name }}
    # A hand-pushed tag may have no CHANGELOG.md section; Build then asks the
    # release-notes model, which needs RELEASE_NOTES_API_KEY.
    secrets: inherit
    permissions:
      contents: write
      id-token: write
      attestations: write
      # Build's build job reads this run's jobs and artifacts for the app icon.
      actions: read
    # Same group as Version's publish job: one tag is only ever built once at a time.
    concurrency:
      group: publish-${{ github.ref_name }}
      cancel-in-progress: false
