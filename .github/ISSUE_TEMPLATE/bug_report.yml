name: Wallpaper or app problem
description: A wallpaper looks or behaves wrong, or the app misbehaves.
labels: [bug]
# The app's "Not working? Report on GitHub" link fills in wallpaper, version and app-details by
# their ids (ExternalLink.newIssue in App/Views/ControlPanel/Model/): rename them together. It
# never fills a required field, so the reporter always writes those.
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. One diagnostics file answers most follow-up questions:
        **Settings → Storage → Troubleshooting → Diagnostics report → Export…** saves a `.zip`
        with recent logs, the lock screen log, macOS crash, resource, spin and hang reports, which
        wallpapers were loading when the app quit unexpectedly, and a system summary. Home folder
        paths, your Mac user name and Steam account names are replaced before it is written.

        If the problem is hard to reproduce, turn on **Detailed logging** in the same place,
        reproduce it, then export. Turn it off afterwards.
  - type: input
    id: wallpaper
    attributes:
      label: Wallpaper
      description: Workshop ID or link (for example `https://steamcommunity.com/sharedfiles/filedetails/?id=123456789`), or the name of a local import. We test with the same wallpaper.
      placeholder: "123456789"
  - type: textarea
    id: steps
    attributes:
      label: What you did
      description: The steps that lead to the problem. If a wallpaper looks wrong as soon as it is applied, say so and on which display.
      placeholder: |
        1. Apply the wallpaper to the built-in display
        2. Wait about a minute
        3. ...
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What went wrong
      description: What you saw, and when (the log times help). Screenshots or a short recording are welcome for visual problems.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What it should look like or do instead. For a wallpaper, how it looks in Wallpaper Engine if you have seen it there.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics report
      description: Drag the exported `WallpaperMachine-diagnostics-….zip` here. Look inside first if you want to check what is shared.
    validations:
      required: true
  - type: textarea
    id: app-details
    attributes:
      label: Details from the app
      description: Filled in when you report from a wallpaper's details in the app (its type, what draws it, any error and the options you changed). Leave it as it is.
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings → About. Already in the diagnostics report; fill this in if you could not export one.
