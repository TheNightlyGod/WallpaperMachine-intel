# Single source of truth for the Xcode project. Regenerate with `xcodegen generate`
# (scripts/build.py and scripts/test.py do this automatically) and commit the result.
# Directory layout and the meaning of each source path: docs/repository-layout.md.
name: WallpaperMachine
options:
  bundleIdPrefix: app.wallpapermachine
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: NO
    DEVELOPMENT_TEAM: ""
    ARCHS: "$(ARCHS_STANDARD)"
    ONLY_ACTIVE_ARCH: YES
    ENABLE_DEBUG_DYLIB: NO
targets:
  MediaRemoteAdapter:
    type: framework
    platform: macOS
    sources:
      - path: upstream/mediaremote-adapter/src
        excludes:
          - test
      - path: upstream/mediaremote-adapter/include
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.wallpapermachine.MediaRemoteAdapter
        GENERATE_INFOPLIST_FILE: YES
        # XcodeGen gives a framework build 1, but bump_version.py rewrites every pbxproj
        # entry; declaring the app's number keeps a regenerated project identical to a bumped one.
        CURRENT_PROJECT_VERSION: "42"
        CLANG_ENABLE_OBJC_ARC: YES
        GCC_SYMBOLS_PRIVATE_EXTERN: NO
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/upstream/mediaremote-adapter/include"
          - "$(SRCROOT)/upstream/mediaremote-adapter/src"
    dependencies:
      - sdk: Foundation.framework
      - sdk: AppKit.framework
      - sdk: UniformTypeIdentifiers.framework
  WallpaperMachine:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Resources/Info.plist
          - Resources/AppIcon.icon
          - Bridge/Generated/WallpaperBridgeFFI.h
          - Bridge/Generated/WallpaperBridgeFFI.modulemap
      - path: App/Resources/AppIcon.icon
        type: file
        buildPhase: resources
      - path: Shared
      - path: Resources/StarterWallpaper
        type: folder
        buildPhase: resources
      - path: CHANGELOG.md
        buildPhase: resources
      - path: Resources/ReleaseBanners
        type: folder
        buildPhase: resources
      - path: upstream/mediaremote-adapter/bin/mediaremote-adapter.pl
        buildPhase: resources
      - path: upstream/mediaremote-adapter/LICENSE
        buildPhase: resources
    dependencies:
      - target: MediaRemoteAdapter
        embed: true
        link: false
      - target: WallpaperMachineExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.wallpapermachine
        PRODUCT_NAME: WallpaperMachine
        INFOPLIST_FILE: App/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.5.7"
        CURRENT_PROJECT_VERSION: "42"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/App/Bridge/Generated"
        SWIFT_OBJC_BRIDGING_HEADER: App/Bridge/WallpaperPreviewBridge.h
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/App/Bridge/Generated"
          - "$(SRCROOT)/upstream/renderer/external/open-wallpaper-engine/src/Platform/Apple"
        LIBRARY_SEARCH_PATHS: &rendererLibraryPaths
          - "$(SRCROOT)/upstream/renderer/target/release"
          - /Users/lukioff/homebrew/opt/mwe-ffmpeg/lib
          - /Users/lukioff/homebrew/lib
          - /Users/lukioff/homebrew/opt/quickjs-ng/lib
          - /Users/lukioff/homebrew/opt/glslang/lib
          - /usr/local/opt/mwe-ffmpeg/lib
          - /usr/local/lib
          - /usr/local/opt/quickjs-ng/lib
          - /usr/local/opt/glslang/lib
          - /opt/homebrew/opt/mwe-ffmpeg/lib
          - /opt/homebrew/lib
          - /opt/homebrew/opt/quickjs-ng/lib
          - /opt/homebrew/opt/glslang/lib
        OTHER_SWIFT_FLAGS: "-Xcc -fmodule-map-file=$(SRCROOT)/App/Bridge/Generated/WallpaperBridgeFFI.modulemap"
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"
          - /Users/lukioff/homebrew/opt/mwe-ffmpeg/lib
          - /Users/lukioff/homebrew/lib
          - /Users/lukioff/homebrew/opt/quickjs-ng/lib
          - /usr/local/opt/mwe-ffmpeg/lib
          - /usr/local/lib
          - /usr/local/opt/quickjs-ng/lib
          - /opt/homebrew/opt/mwe-ffmpeg/lib
          - /opt/homebrew/lib
          - /opt/homebrew/opt/quickjs-ng/lib
        OTHER_LDFLAGS: &rendererLinkerFlags
          - -lwallpaper_bridge
          - -lc++
          - -lvulkan
          - -llz4
          - -lfreetype
          - -lavformat
          - -lavcodec
          - -lavutil
          - -lswresample
          - -lavfilter
          - -lavdevice
          - -lswscale
          - -lqjs
          - -lglslang
          - -lSPIRV
          - -lglslang-default-resource-limits
          - -liconv
          - -framework Accelerate
          - -framework AppKit
          - -framework CoreAudio
          - -framework CoreData
          - -framework CoreFoundation
          - -framework CoreGraphics
          - -framework CoreImage
          - -framework CoreMedia
          - -framework CoreText
          - -framework CoreVideo
          - -framework Foundation
          - -framework IOSurface
          - -framework Metal
          - -framework OpenGL
          - -framework QuartzCore
          - -framework VideoToolbox
  WallpaperMachineExtension:
    type: extensionkit-extension
    platform: macOS
    sources:
      - path: Extension
        excludes:
          - Info.plist
          - WallpaperExtension.entitlements
      - path: Shared
      - path: Resources/StarterWallpaper/preview.jpg
        buildPhase: resources
    dependencies:
      - sdk: WebKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.wallpapermachine.wallpaper-extension
        PRODUCT_NAME: WallpaperMachineExtension
        INFOPLIST_FILE: Extension/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: WallpaperMachine Wallpapers
        MARKETING_VERSION: "1.5.7"
        CURRENT_PROJECT_VERSION: "42"
        ENABLE_APP_SANDBOX: YES
        CODE_SIGN_ENTITLEMENTS: Extension/WallpaperExtension.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_OBJC_BRIDGING_HEADER: Extension/WallpaperExtensionBridge.h
        HEADER_SEARCH_PATHS: "$(SRCROOT)/upstream/renderer/external/open-wallpaper-engine/src/Platform/Apple"
        LIBRARY_SEARCH_PATHS: *rendererLibraryPaths
        OTHER_LDFLAGS: *rendererLinkerFlags
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"
          - "@executable_path/../../../../Frameworks"
          - /Users/lukioff/homebrew/opt/mwe-ffmpeg/lib
          - /Users/lukioff/homebrew/lib
          - /Users/lukioff/homebrew/opt/quickjs-ng/lib
          - /usr/local/opt/mwe-ffmpeg/lib
          - /usr/local/lib
          - /usr/local/opt/quickjs-ng/lib
          - /opt/homebrew/opt/mwe-ffmpeg/lib
          - /opt/homebrew/lib
          - /opt/homebrew/opt/quickjs-ng/lib
        SKIP_INSTALL: YES
  WallpaperMachineTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/Unit
    dependencies:
      - target: WallpaperMachine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.wallpapermachine.tests
        GENERATE_INFOPLIST_FILE: YES
        # Tests/Unit/Support/TestBundle.swift: replaces the app's desktop actions before any test runs.
        INFOPLIST_KEY_NSPrincipalClass: WallpaperMachineTestBundle
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/WallpaperMachine.app/Contents/MacOS/WallpaperMachine"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/App/Bridge/Generated"
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/App/Bridge/Generated"
          - "$(SRCROOT)/upstream/renderer/external/open-wallpaper-engine/src/Platform/Apple"
        OTHER_SWIFT_FLAGS: "-Xcc -fmodule-map-file=$(SRCROOT)/App/Bridge/Generated/WallpaperBridgeFFI.modulemap"
  WallpaperMachineUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - Tests/UI
    dependencies:
      - target: WallpaperMachine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.wallpapermachine.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: WallpaperMachine
schemes:
  WallpaperMachine:
    build:
      targets:
        WallpaperMachine: all
    run:
      config: Debug
    test:
      config: Debug
      # The tests run inside the app, which mirrors its own language choice into its AppleLanguages
      # override; English here keeps `Bundle.main` strings English whatever that choice is.
      language: en
      targets:
        - WallpaperMachineTests
  WallpaperMachineUI:
    build:
      targets:
        WallpaperMachine: all
    test:
      config: Debug
      targets:
        - WallpaperMachineUITests
